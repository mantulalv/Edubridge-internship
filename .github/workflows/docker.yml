name: Build and push Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./assignment-5-house-price-prediction
          file: ./assignment-5-house-price-prediction/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/house-price-prediction:latest
